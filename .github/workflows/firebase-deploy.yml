name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install Dependencies
        run: npm ci

      - name: Create .env.production
        run: |
          echo "NEXT_PUBLIC_API_URL=https://cdd-backend-215337606799.europe-west1.run.app" > .env.production
          echo "NEXTAUTH_URL=https://cuadernofp.web.app" >> .env.production
          echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" >> .env.production
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Preparar generadores de documentos (se ejecutan en el navegador)
        run: node scripts/preparar-generadores.mjs

      # La web se publica como archivos estáticos (out/): la función de SSR de Firebase no arrancaba con Next 16.
      # NextAuth (src/app/api/auth) necesita servidor y la web no lo usa, así que se quita antes de exportar.
      - name: Quitar NextAuth (no cabe en una exportación estática)
        run: rm -rf src/app/api/auth

      - name: Build Next.js App (exportación estática)
        run: npx next build --webpack
        env:
          WEB_ESTATICO: '1'
          NEXT_PUBLIC_API_URL: https://cdd-backend-215337606799.europe-west1.run.app
          NEXTAUTH_URL: https://cuadernofp.web.app
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project cuadernofp
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
